# 本地开发只用容器跑数据库，应用用 `npm run dev` 直接运行（支持热更新）。
# 启动：docker compose -f compose.dev.yaml up -d
name: yuzu-dev

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    # 预加载 pg_stat_statements（数据库评估第 4 节）：记下各条查询的次数与耗时，`cli.js db-report` 看最慢的查询；只多占一点共享内存
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=top"]
    environment:
      POSTGRES_USER: yuzu
      POSTGRES_PASSWORD: yuzu_dev_only
      POSTGRES_DB: yuzu_dev
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dev-pgdata:/var/lib/postgresql/data
      - ./scripts/dev-init-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuzu -d yuzu_dev"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  dev-pgdata:
